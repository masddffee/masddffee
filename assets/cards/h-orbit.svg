<style>@font-face{font-family:JBM;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:JBM;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:JBM;font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:JBM, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.cjk{font-family:'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes fadein{from{opacity:0}to{opacity:1}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.blink{animation:blink 1.1s steps(1) infinite}.pulse{animation:pulse 1.8s ease-in-out infinite}@keyframes sweep{from{transform:translateX(-160px)}to{transform:translateX(1000px)}}.sw{animation:sweep 5s cubic-bezier(.6,0,.4,1) infinite}</style>
