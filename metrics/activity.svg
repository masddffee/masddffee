<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" role="img" aria-labelledby="title desc">
  <title id="title">GitHub engineering activity</title>
  <desc id="desc">Activity metrics are refreshing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect x="0.75" y="0.75" width="978.5" height="298.5" rx="18" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="32" cy="34" r="5" fill="#39d353"/>
  <text x="48" y="40" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="700">Engineering activity</text>
  <text x="48" y="63" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12">Private-aware activity pipeline installed</text>
  <rect x="30" y="92" width="920" height="158" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="490" y="154" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="700">Refreshing contribution data…</text>
  <text x="490" y="184" text-anchor="middle" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12">The scheduled workflow will replace this card automatically.</text>
  <text x="490" y="207" text-anchor="middle" fill="#6e7681" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11">Private repo names and commit messages are never rendered.</text>
</svg>
